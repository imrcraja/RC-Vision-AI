name: Daily learning package and model research

on:
  workflow_dispatch:
  schedule:
    - cron: "20 3 * * *"
  push:
    branches: [main]
    paths:
      - "training/package_daily_learning.py"
      - "training/image/**"
      - "tests/test_daily_package.py"
      - ".github/workflows/daily-learning-package.yml"

permissions:
  contents: read

concurrency:
  group: rc-vision-ai-daily-learning
  cancel-in-progress: false

jobs:
  daily-package:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: training/llm/requirements.txt

      - name: Install training and image research dependencies
        run: python -m pip install --upgrade pip && python -m pip install -r training/llm/requirements.txt pillow

      - name: Run ZIP packaging tests and syntax checks
        run: |
          python -m py_compile training/llm/train.py training/llm/generate.py training/llm/gemini_corpus.py training/image/train_autoencoder.py training/image/train_diffusion.py training/image/generate_image.py training/image/model.py training/image/test_research.py training/package_daily_learning.py
          python -m unittest discover -s tests -p 'test_daily_package.py' -v
          PYTHONPATH=training/image python -m unittest discover -s training/image -p 'test_research.py' -v

      - name: Restore best-effort prior LLM checkpoint cache
        uses: actions/cache/restore@v4
        with:
          path: artifacts/llm
          key: rc-vision-ai-daily-llm-${{ github.run_id }}
          restore-keys: |
            rc-vision-ai-daily-llm-

      - name: Prepare daily training corpus
        shell: bash
        run: |
          mkdir -p artifacts
          if [ -n "$GEMINI_API_KEY" ]; then
            python training/llm/gemini_corpus.py \
              --base-corpus training/corpus/rc_vision_original.txt \
              --output artifacts/daily-training-corpus.txt \
              --topics 2
          else
            cp training/corpus/rc_vision_original.txt artifacts/daily-training-corpus.txt
            echo "GEMINI_API_KEY is not configured; using the checked-in seed corpus today."
          fi

      - name: Locate a compatible cached LLM checkpoint
        id: prior
        shell: bash
        run: |
          latest="$(find artifacts/llm -maxdepth 1 -type f -name 'checkpoint-*.pt' -print 2>/dev/null | sort -V | tail -n 1)"
          if [ -n "$latest" ]; then
            echo "path=$latest" >> "$GITHUB_OUTPUT"
            echo "Found checkpoint: $latest"
          else
            echo "path=" >> "$GITHUB_OUTPUT"
            echo "No cached checkpoint; this run starts from random initialization."
          fi

      - name: Train or continue the original LLM
        shell: bash
        run: |
          RESUME_ARGS=()
          if [ -n "${{ steps.prior.outputs.path }}" ]; then
            RESUME_ARGS=(--resume "${{ steps.prior.outputs.path }}")
          fi
          python training/llm/train.py \
            --corpus artifacts/daily-training-corpus.txt \
            --output artifacts/llm \
            --steps 500 \
            --batch-size 8 \
            --context 128 \
            --width 128 \
            --layers 4 \
            --heads 4 \
            --checkpoint-every 250 \
            "${RESUME_ARGS[@]}"

      - name: Train original image model when a permitted dataset exists
        shell: bash
        run: |
          if [ -f training/images/captions.jsonl ] && [ "$(grep -c '"caption"' training/images/captions.jsonl || true)" -ge 2 ]; then
            python training/image/train_diffusion.py --dataset training/images --manifest training/images/captions.jsonl --output artifacts/image --image-size 32 --epochs 1 --batch-size 2 --diffusion-steps 50
          else
            image_count="$(find training/images -type f \( -iname '*.png' -o -iname '*.jpg' -o -iname '*.jpeg' -o -iname '*.webp' -o -iname '*.bmp' \) 2>/dev/null | wc -l)"
            if [ "$image_count" -ge 2 ]; then
              python training/image/train_autoencoder.py --dataset training/images --output artifacts/image --image-size 64 --epochs 1 --batch-size 4
            else
              echo "Image training skipped: add at least 2 permitted images; for conditional diffusion, also add captions.jsonl with at least 2 image/caption pairs."
            fi
          fi

      - name: Smoke-test conditional image sampling when a checkpoint exists
        shell: bash
        run: |
          if [ -f artifacts/image/conditional-diffusion.pt ]; then
            PYTHONPATH=training/image python training/image/generate_image.py \
              --checkpoint artifacts/image/conditional-diffusion.pt \
              --prompt "a simple original research sample" \
              --output artifacts/image/sample.png
          else
            echo "No conditional diffusion checkpoint exists yet; no prompt-based image sample is claimed."
          fi

      - name: Save best-effort LLM checkpoint cache
        uses: actions/cache/save@v4
        with:
          path: artifacts/llm
          key: rc-vision-ai-daily-llm-${{ github.run_id }}

      - name: Build daily learning ZIP
        run: |
          python training/package_daily_learning.py \
            --output artifacts/rc-vision-ai-daily-learning.zip \
            --llm-dir artifacts/llm \
            --image-dir artifacts/image \
            --corpus artifacts/daily-training-corpus.txt

      - name: Upload daily ZIP and raw metrics
        uses: actions/upload-artifact@v4
        with:
          name: rc-vision-ai-daily-learning-${{ github.run_id }}
          path: |
            artifacts/rc-vision-ai-daily-learning.zip
            artifacts/llm/latest.json
            artifacts/image/*metrics.json
          if-no-files-found: warn
          retention-days: 14
