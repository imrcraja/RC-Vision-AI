name: Gemini-assisted incremental LLM research training

on:
  workflow_dispatch:
    inputs:
      generated_sections:
        description: Number of short Gemini-generated training sections (1-5)
        required: true
        default: "5"
        type: choice
        options: ["1", "2", "3", "4", "5"]
      training_steps:
        description: Additional local training steps for this run
        required: true
        default: "2000"
        type: choice
        options: ["500", "1000", "2000", "4000"]
  schedule:
    - cron: "0 3 * * *"

permissions:
  contents: read

concurrency:
  group: rc-vision-ai-gemini-assisted-training
  cancel-in-progress: false

jobs:
  generate-and-train:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Check required API secret
        shell: bash
        run: |
          if [ -z "$GEMINI_API_KEY" ]; then
            echo "::error::Add GEMINI_API_KEY in Repository Settings > Secrets and variables > Actions."
            exit 1
          fi

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: training/llm/requirements.txt

      - name: Install training dependency
        run: python -m pip install --upgrade pip && python -m pip install -r training/llm/requirements.txt

      - name: Restore latest available project checkpoint cache
        uses: actions/cache/restore@v4
        with:
          path: artifacts/llm
          key: rc-vision-ai-llm-checkpoint-${{ github.run_id }}
          restore-keys: |
            rc-vision-ai-llm-checkpoint-

      - name: Generate a permission-safe synthetic corpus with Gemini
        run: |
          python -m py_compile training/llm/gemini_corpus.py training/llm/train.py
          python training/llm/gemini_corpus.py \
            --base-corpus training/corpus/rc_vision_original.txt \
            --output artifacts/gemini-training-corpus.txt \
            --topics "${{ inputs.generated_sections || '5' }}"

      - name: Find a compatible previous checkpoint
        id: checkpoint
        shell: bash
        run: |
          mkdir -p artifacts/llm
          latest="$(find artifacts/llm -maxdepth 1 -type f -name 'checkpoint-*.pt' -print | sort -V | tail -n 1)"
          if [ -n "$latest" ]; then
            echo "path=$latest" >> "$GITHUB_OUTPUT"
            echo "Found prior checkpoint: $latest"
          else
            echo "path=" >> "$GITHUB_OUTPUT"
            echo "No cached checkpoint; first run starts from random initialization."
          fi

      - name: Train or continue the original model
        shell: bash
        run: |
          STEPS="${{ inputs.training_steps || '2000' }}"
          RESUME_ARGS=()
          if [ -n "${{ steps.checkpoint.outputs.path }}" ]; then
            RESUME_ARGS=(--resume "${{ steps.checkpoint.outputs.path }}")
          fi
          python training/llm/train.py \
            --corpus artifacts/gemini-training-corpus.txt \
            --output artifacts/llm \
            --steps "$STEPS" \
            --batch-size 8 \
            --context 128 \
            --width 128 \
            --layers 4 \
            --heads 4 \
            --checkpoint-every 250 \
            "${RESUME_ARGS[@]}"

      - name: Smoke-test the latest checkpoint
        shell: bash
        run: |
          latest="$(find artifacts/llm -maxdepth 1 -type f -name 'checkpoint-*.pt' -print | sort -V | tail -n 1)"
          test -n "$latest"
          python training/llm/generate.py --checkpoint "$latest" --prompt "RC Vision AI is" --new-bytes 96 --seed 7

      - name: Save checkpoint cache for the next run
        uses: actions/cache/save@v4
        with:
          path: artifacts/llm
          key: rc-vision-ai-llm-checkpoint-${{ github.run_id }}

      - name: Upload checkpoints, metrics and generated corpus
        uses: actions/upload-artifact@v4
        with:
          name: rc-vision-ai-gemini-assisted-training-${{ github.run_id }}
          path: |
            artifacts/llm/
            artifacts/gemini-training-corpus.txt
          if-no-files-found: error
          retention-days: 14
