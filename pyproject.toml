[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "rc-vision-ai"
version = "0.1.0"
description = "Independent, local-first image AI research runtime"
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
rc-vision-ai = "rc_vision_ai.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
